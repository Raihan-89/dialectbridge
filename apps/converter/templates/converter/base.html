<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SQL Conversion Engine{% endblock %}</title>
    <style>
        :root {
            --bg: #f5f7fc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
            --success: #059669;
            --success-soft: #ecfdf5;
            --danger: #dc2626;
            --danger-soft: #fef2f2;
            --warning: #d97706;
            --warning-soft: #fffbeb;
            --radius: 14px;
            --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .04);
            --shadow-lg: 0 10px 30px rgba(15, 23, 42, .12);
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: hidden; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 10% 0%, rgba(79,70,229,.07), transparent 28rem), radial-gradient(circle at 100% 20%, rgba(124,58,237,.05), transparent 25rem);
            overflow-x: hidden;
        }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ---- top bar ---- */
        .topbar {
            background: rgba(255,255,255,.9);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-inner {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 24px;
            height: 60px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
            min-width: 0;
        }
        .brand:hover { text-decoration: none; }
        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 6px 16px rgba(79,70,229,.25);
        }
        .nav-toggle { display: none; margin-left: auto; width: 40px; height: 40px; padding: 0; font-size: 20px; }
        .nav-links { display: flex; gap: 4px; margin-left: auto; }
        .nav-links a {
            color: var(--muted);
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 8px;
            transition: background .15s, color .15s;
        }
        .nav-links a:hover { color: var(--text); background: var(--bg); text-decoration: none; }
        .nav-links a.active {
            color: var(--primary);
            background: var(--primary-soft);
            box-shadow: inset 0 0 0 1px rgba(79,70,229,.08);
        }

        /* ---- layout ---- */
        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 32px 20px;
            width: 100%;
            flex: 1;
            min-width: 0;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 26px;
            margin-bottom: 24px;
            transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
            min-width: 0;
        }
        .card:hover { box-shadow: 0 8px 28px rgba(15,23,42,.08); border-color: #d7ddeb; }
        .card h2 { margin-top: 0; }
        .grid-2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; }
        .grid-2 > * { min-width: 0; }
        .migration-layout { grid-template-columns: minmax(300px,.72fr) minmax(0,1.58fr); }
        .connection-layout { grid-template-columns: minmax(300px,.72fr) minmax(0,1.58fr); }
        .migration-history-wrap { overflow: visible; }
        .connection-list-wrap { overflow: visible; }
        .migration-history { table-layout: auto; }
        .connection-list { table-layout: auto; }
        .migration-history td, .migration-history th { white-space: normal; }
        .connection-list td, .connection-list th { white-space: normal; }
        .migration-history .table-actions { white-space: nowrap; }
        @media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }

        h1, h2, h3 { line-height: 1.3; }
        h1 { font-size: clamp(25px, 3vw, 32px); margin: 0 0 6px; letter-spacing: -.025em; }
        h2 { font-size: 20px; }
        h3 { font-size: 16px; margin-bottom: 12px; }
        .page-title { margin-bottom: 4px; }
        .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; }
        .filter-grid { grid-template-columns: minmax(150px,200px) minmax(150px,200px) minmax(220px,1fr) auto; align-items: end; }

        /* ---- forms ---- */
        .form-grid { display: grid; gap: 14px; }
        .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: var(--text); }
        .field .hint { font-weight: 400; color: var(--muted); }
        input[type="text"], input[type="number"], input[type="password"],
        select, textarea {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            transition: border-color .15s, box-shadow .15s;
            min-width: 0;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }
        input:hover, select:hover, textarea:hover { border-color: #cbd5e1; }
        textarea { font-family: var(--font-mono); line-height: 1.5; }
        .checkbox-line { display: flex; align-items: flex-start; gap: 9px; font-weight: 500; overflow-wrap: anywhere; }
        .checkbox-line input { width: auto; flex: 0 0 auto; margin-top: 5px; }

        /* ---- buttons ---- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background .15s, transform .08s, box-shadow .15s;
            background: var(--primary);
            color: #fff;
            white-space: nowrap;
            flex: 0 0 auto;
        }
        .btn:hover { background: var(--primary-hover); box-shadow: 0 6px 14px rgba(79,70,229,.18); text-decoration: none; }
        .btn:active { transform: translateY(1px); }
        .btn-outline {
            background: var(--surface);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover { background: var(--primary-soft); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #b91c1c; }
        .btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--border); }
        .btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 6px; }
        .btn[disabled] { opacity: .5; cursor: not-allowed; }
        /* Must follow .btn, whose inline-flex display would otherwise expose
           the mobile menu control on desktop. */
        .nav-toggle { display: none; }
        .btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        /* ---- alerts ---- */
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; border: 1px solid transparent; overflow-wrap: anywhere; }
        .alert-success { background: var(--success-soft); color: #065f46; border-color: #a7f3d0; }
        .alert-error { background: var(--danger-soft); color: #991b1b; border-color: #fecaca; }
        .alert-warning { background: var(--warning-soft); color: #92400e; border-color: #fde68a; }

        /* ---- tables ---- */
        .table-wrap { max-width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; -webkit-overflow-scrolling: touch; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: var(--surface);
        }
        th {
            text-align: left;
            padding: 10px 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
            white-space: nowrap;
        }
        td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        td, th { overflow-wrap: normal; word-break: normal; }
        td.table-actions, th.table-actions { width: 1%; min-width: max-content; white-space: nowrap; }
        .table-actions .btn-row { flex-wrap: nowrap; }
        .table-actions form { margin: 0; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f8fafc; }

        /* ---- badges ---- */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            max-width: 100%;
            white-space: nowrap;
            line-height: 1.35;
        }
        .badge-ok { background: var(--success-soft); color: var(--success); }
        .badge-fail { background: var(--danger-soft); color: var(--danger); }
        .badge-warn { background: var(--warning-soft); color: var(--warning); }
        .badge-neutral { background: var(--bg); color: var(--muted); }

        /* ---- code / result ---- */
        .code-block {
            background: #0f172a;
            color: #e2e8f0;
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 18px;
            border-radius: 10px;
            overflow-x: auto;
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-width: 100%;
        }
        .inline-code { font-family: var(--font-mono); font-size: 13px; background: var(--bg); padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }

        .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
        .section-head h2 { margin: 0; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
        .empty-state .big { font-size: 40px; margin-bottom: 8px; }
        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            padding: 20px;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }
        .meta-list { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; font-size: 14px; }
        .meta-list > div { padding: 12px; border: 1px solid var(--border); border-radius: 9px; background: #f8fafc; min-width: 0; }
        .meta-list .label { color: var(--muted); display: block; min-width: 0; font-size: 12px; }
        .mono { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; word-break: break-word; }
        .progress-track { width: 100%; height: 12px; overflow: hidden; border-radius: 999px; background: var(--border); }
        .progress-bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), #7c3aed); transition: width .35s ease; }
        .progress-meta { display: flex; justify-content: space-between; gap: 12px; margin: 8px 0 0; color: var(--muted); font-size: 13px; }
        details summary { transition: color .15s; }
        details summary:hover { color: var(--primary) !important; }

        /* ---- confirmation modal ---- */
        .confirm-dialog { width:min(440px,calc(100vw - 28px)); padding:0; border:0; border-radius:18px; color:var(--text); background:var(--surface); box-shadow:0 24px 70px rgba(15,23,42,.28); }
        .confirm-dialog::backdrop { background:rgba(15,23,42,.58); backdrop-filter:blur(4px); }
        .confirm-card { padding:26px; }
        .confirm-icon { width:48px; height:48px; display:grid; place-items:center; border-radius:14px; background:var(--danger-soft); color:var(--danger); font-size:24px; font-weight:800; margin-bottom:18px; }
        .confirm-card h2 { margin:0 0 8px; font-size:21px; }
        .confirm-card p { margin:0; color:var(--muted); font-size:14px; line-height:1.6; overflow-wrap:anywhere; }
        .confirm-actions { display:flex; justify-content:flex-end; gap:10px; padding:16px 26px; border-top:1px solid var(--border); background:#f8fafc; }

        @media (max-width: 900px) {
            .topbar-inner { height: 60px; position: relative; }
            .nav-toggle { display: inline-flex; }
            .nav-links {
                display: none; position: absolute; top: 52px; left: 16px; right: 16px;
                padding: 10px; border: 1px solid var(--border); border-radius: 12px;
                background: var(--surface); box-shadow: var(--shadow-lg); flex-direction: column;
            }
            .nav-links.open { display: flex; }
            .nav-links a { width: 100%; }
            .filter-grid { grid-template-columns: 1fr 1fr; }
            .filter-grid .btn { width: 100%; }
            .meta-list { grid-template-columns: repeat(2,minmax(0,1fr)); }
            .migration-layout { grid-template-columns: 1fr; }
            .connection-layout { grid-template-columns: 1fr; }
            .migration-history-wrap, .connection-list-wrap { border: 0; border-radius: 0; }
            .migration-history, .migration-history tbody, .migration-history tr, .migration-history td,
            .connection-list, .connection-list tbody, .connection-list tr, .connection-list td { display: block; width: 100%; min-width: 0; }
            .migration-history, .connection-list { min-width: 0; background: transparent; }
            .migration-history thead, .connection-list thead { display: none; }
            .migration-history tbody, .connection-list tbody { display: grid; gap: 10px; }
            .migration-history tr, .connection-list tr { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
            .migration-history td, .connection-list td { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 10px; padding: 5px 0; border: 0; overflow-wrap: anywhere; }
            .migration-history td::before, .connection-list td::before { content: attr(data-label); color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
            .migration-history td.table-actions { width: 100%; white-space: normal; }
            .connection-list td.table-actions { width: 100%; white-space: normal; }
            .migration-history td.table-actions .btn { width: 100%; margin-top: 4px; }
            .connection-list td.table-actions .btn-row { display: grid; grid-template-columns: 1fr 1fr; width: 100%; margin-top: 4px; }
            .connection-list td.table-actions .btn, .connection-list td.table-actions form { width: 100%; }
        }
        @media (max-width: 600px) {
            body { font-size: 14px; line-height: 1.5; }
            .topbar-inner { padding: 0 14px; gap: 10px; }
            .container { padding: 18px 12px; }
            .card { padding: 16px; margin-bottom: 14px; border-radius: 11px; }
            .brand { font-size: 13px; gap: 8px; white-space: nowrap; }
            .brand-logo { width: 29px; height: 29px; font-size: 13px; }
            h1 { font-size: 23px; line-height: 1.2; }
            h2 { font-size: 17px; }
            h3 { font-size: 15px; }
            .grid-2, .filter-grid { grid-template-columns: 1fr; gap: 14px; }
            .btn:not(.btn-sm) { width: 100%; min-height: 40px; padding: 8px 12px; font-size: 13px; }
            .btn-row { display: flex; width: 100%; gap: 7px; }
            .btn-row .btn:not(.btn-sm) { flex: 1 1 145px; width: auto; }
            .btn-row .btn-sm { width: auto; flex: 0 0 auto; }
            .btn-row .badge { width: auto; text-align: center; }
            .nav-toggle { width: 38px !important; min-height: 38px !important; padding: 0 !important; flex: 0 0 38px; }
            .nav-links { left: 10px; right: 10px; }
            .section-head { align-items: flex-start; flex-direction: column; }
            .subtitle { font-size: 13px; line-height: 1.5; margin-bottom: 18px; }
            input[type="text"], input[type="number"], input[type="password"], select, textarea { font-size: 16px; padding: 9px 10px; }
            textarea { min-height: 220px; font-size: 12px; line-height: 1.45; }
            .table-wrap { border-radius: 8px; }
            table { font-size: 12px; min-width: 560px; }
            th { font-size: 10px; letter-spacing: .025em; }
            th, td { padding: 8px; }
            .badge { padding: 3px 7px; font-size: 10px; border-radius: 7px; }
            .conversion-history td:last-child { max-width: 120px; white-space: normal; }
            .conversion-history td:last-child .badge { white-space: normal; overflow-wrap: anywhere; text-align: center; }
            .alert { padding: 10px 12px; font-size: 12px; }
            .code-block { padding: 12px; font-size: 11px; line-height: 1.5; }
            .mono, .inline-code { font-size: 11px; }
            .meta-list { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
            .meta-list > div { padding: 9px; }
            .empty-state { padding: 25px 10px; }
            .empty-state .big { font-size: 30px; }
            .progress-meta { align-items: flex-start; }
            .footer { padding: 14px 10px; font-size: 11px; }
        }
        @media (max-width: 380px) {
            .brand-name { display: none; }
            h1 { font-size: 21px; }
            .container { padding-inline: 9px; }
            .card { padding: 13px; }
            .meta-list { grid-template-columns: 1fr; }
            table { min-width: 500px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'convert-form' %}">
                <span class="brand-logo">&lt;/&gt;</span>
                <span class="brand-name">SQL Conversion Engine</span>
            </a>
            <button class="btn btn-ghost nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle navigation">☰</button>
            <nav class="nav-links" id="main-nav">
                <a href="{% url 'convert-form' %}" class="{% block nav_convert %}{% endblock %}">Convert</a>
                <a href="{% url 'history' %}" class="{% block nav_history %}{% endblock %}">History</a>
                <a href="{% url 'connections' %}" class="{% block nav_connections %}{% endblock %}">Connections</a>
                <a href="{% url 'migrate' %}" class="{% block nav_migrate %}{% endblock %}">Migrate</a>
                <a href="{% url 'verify' %}" class="{% block nav_verify %}{% endblock %}">Verify</a>
                <a href="{% url 'errors' %}" class="{% block nav_errors %}{% endblock %}">Errors</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        SQL Conversion Engine — MSSQL ⇄ PostgreSQL
    </footer>
    <dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <div class="confirm-card">
            <div class="confirm-icon" aria-hidden="true">!</div>
            <h2 id="confirm-title">Delete this item?</h2>
            <p id="confirm-message">This action cannot be undone.</p>
        </div>
        <div class="confirm-actions">
            <button type="button" class="btn btn-ghost" id="confirm-cancel">No, keep it</button>
            <button type="button" class="btn btn-danger" id="confirm-delete">Yes, delete</button>
        </div>
    </dialog>
    <script>
        (() => {
            const toggle = document.querySelector('.nav-toggle');
            const nav = document.getElementById('main-nav');
            if (!toggle || !nav) return;
            toggle.addEventListener('click', () => {
                const open = nav.classList.toggle('open');
                toggle.setAttribute('aria-expanded', String(open));
                toggle.textContent = open ? '×' : '☰';
            });
            document.addEventListener('click', event => {
                if (!nav.contains(event.target) && !toggle.contains(event.target)) {
                    nav.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.textContent = '☰';
                }
            });
        })();
        (() => {
            const dialog = document.getElementById('confirm-dialog');
            const title = document.getElementById('confirm-title');
            const message = document.getElementById('confirm-message');
            const cancel = document.getElementById('confirm-cancel');
            const approve = document.getElementById('confirm-delete');
            let pendingForm = null;

            document.querySelectorAll('form[data-confirm]').forEach(form => {
                form.addEventListener('submit', event => {
                    event.preventDefault();
                    pendingForm = form;
                    title.textContent = form.dataset.confirmTitle || 'Delete this item?';
                    message.textContent = form.dataset.confirmMessage || 'This action cannot be undone.';
                    dialog.showModal();
                    cancel.focus();
                });
            });
            cancel.addEventListener('click', () => dialog.close());
            approve.addEventListener('click', () => {
                if (!pendingForm) return;
                approve.disabled = true;
                approve.textContent = 'Deleting…';
                pendingForm.submit();
            });
            dialog.addEventListener('click', event => {
                if (event.target === dialog) dialog.close();
            });
            dialog.addEventListener('close', () => {
                pendingForm = null;
                approve.disabled = false;
                approve.textContent = 'Yes, delete';
            });
        })();
    </script>
</body>
</html>
