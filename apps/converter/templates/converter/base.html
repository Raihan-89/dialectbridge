<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SQL Conversion Engine{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
        nav a { margin-right: 16px; text-decoration: none; color: #2563eb; }
        textarea { width: 100%; font-family: monospace; font-size: 14px; padding: 10px; box-sizing: border-box; }
        select, button { padding: 8px 12px; font-size: 14px; }
        button { background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        pre { background: #f4f4f5; padding: 16px; border-radius: 6px; overflow-x: auto; }
        .warning { color: #b45309; background: #fffbeb; padding: 8px 12px; border-radius: 4px; margin: 4px 0; }
        .error { color: #b91c1c; background: #fef2f2; padding: 8px 12px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'convert-form' %}">Convert</a>
        <a href="{% url 'history' %}">History</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
