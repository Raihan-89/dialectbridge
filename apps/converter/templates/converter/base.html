<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SQL Conversion Engine{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
            --success: #059669;
            --success-soft: #ecfdf5;
            --danger: #dc2626;
            --danger-soft: #fef2f2;
            --warning: #d97706;
            --warning-soft: #fffbeb;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .04);
            --shadow-lg: 0 10px 30px rgba(15, 23, 42, .12);
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ---- top bar ---- */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 24px;
            height: 60px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
        }
        .brand:hover { text-decoration: none; }
        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 16px;
            font-weight: 800;
        }
        .nav-links { display: flex; gap: 4px; margin-left: auto; }
        .nav-links a {
            color: var(--muted);
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 8px;
            transition: background .15s, color .15s;
        }
        .nav-links a:hover { color: var(--text); background: var(--bg); text-decoration: none; }
        .nav-links a.active {
            color: var(--primary);
            background: var(--primary-soft);
        }

        /* ---- layout ---- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px;
            width: 100%;
            flex: 1;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
        }
        .card h2 { margin-top: 0; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }

        h1, h2, h3 { line-height: 1.3; }
        h1 { font-size: 26px; margin: 0 0 6px; }
        h2 { font-size: 20px; }
        h3 { font-size: 16px; margin-bottom: 12px; }
        .page-title { margin-bottom: 4px; }
        .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; }

        /* ---- forms ---- */
        .form-grid { display: grid; gap: 14px; }
        .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: var(--text); }
        .field .hint { font-weight: 400; color: var(--muted); }
        input[type="text"], input[type="number"], input[type="password"],
        select, textarea {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }
        textarea { font-family: var(--font-mono); line-height: 1.5; }
        .checkbox-line { display: flex; align-items: center; gap: 8px; font-weight: 500; }
        .checkbox-line input { width: auto; }

        /* ---- buttons ---- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background .15s, transform .05s;
            background: var(--primary);
            color: #fff;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: translateY(1px); }
        .btn-outline {
            background: var(--surface);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover { background: var(--primary-soft); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #b91c1c; }
        .btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--border); }
        .btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 6px; }
        .btn[disabled] { opacity: .5; cursor: not-allowed; }
        .btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        /* ---- alerts ---- */
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; border: 1px solid transparent; }
        .alert-success { background: var(--success-soft); color: #065f46; border-color: #a7f3d0; }
        .alert-error { background: var(--danger-soft); color: #991b1b; border-color: #fecaca; }
        .alert-warning { background: var(--warning-soft); color: #92400e; border-color: #fde68a; }

        /* ---- tables ---- */
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: var(--surface);
        }
        th {
            text-align: left;
            padding: 10px 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f8fafc; }

        /* ---- badges ---- */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-ok { background: var(--success-soft); color: var(--success); }
        .badge-fail { background: var(--danger-soft); color: var(--danger); }
        .badge-warn { background: var(--warning-soft); color: var(--warning); }
        .badge-neutral { background: var(--bg); color: var(--muted); }

        /* ---- code / result ---- */
        .code-block {
            background: #0f172a;
            color: #e2e8f0;
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 18px;
            border-radius: 10px;
            overflow-x: auto;
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .inline-code { font-family: var(--font-mono); font-size: 13px; background: var(--bg); padding: 2px 6px; border-radius: 4px; }

        .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
        .section-head h2 { margin: 0; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
        .empty-state .big { font-size: 40px; margin-bottom: 8px; }
        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            padding: 20px;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }
        .meta-list { display: grid; gap: 6px; font-size: 14px; }
        .meta-list .label { color: var(--muted); display: inline-block; min-width: 110px; }
        .mono { font-family: var(--font-mono); font-size: 13px; }
        .progress-track { width: 100%; height: 12px; overflow: hidden; border-radius: 999px; background: var(--border); }
        .progress-bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), #7c3aed); transition: width .35s ease; }
        .progress-meta { display: flex; justify-content: space-between; gap: 12px; margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'convert-form' %}">
                <span class="brand-logo">&lt;/&gt;</span>
                SQL Conversion Engine
            </a>
            <nav class="nav-links">
                <a href="{% url 'convert-form' %}" class="{% block nav_convert %}{% endblock %}">Convert</a>
                <a href="{% url 'history' %}" class="{% block nav_history %}{% endblock %}">History</a>
                <a href="{% url 'connections' %}" class="{% block nav_connections %}{% endblock %}">Connections</a>
                <a href="{% url 'migrate' %}" class="{% block nav_migrate %}{% endblock %}">Migrate</a>
                <a href="{% url 'errors' %}" class="{% block nav_errors %}{% endblock %}">Errors</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        SQL Conversion Engine — MSSQL ⇄ PostgreSQL
    </footer>
</body>
</html>
